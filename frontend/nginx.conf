server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Backups (DB dumps / JSON bundles) are uploaded through this proxy for
    # restore; the default 1 MB body cap rejects them with 413. Allow large
    # uploads and give long-running backup/restore requests room to finish.
    client_max_body_size 0;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
