# Stack isolato per i test end-to-end. Non tocca i dati reali:
# - DB separato (peculium_test) con volume proprio
# - porte host diverse (5433 / 6380 / 8081)
# - fetch Yahoo disabilitato
#
# Uso: make test-e2e
name: peculium-test

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: peculium_test
      POSTGRES_USER: peculium
      POSTGRES_PASSWORD: peculium
    ports:
      - "5433:5432"
    volumes:
      - pgdata_test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peculium"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      PECULIUM_DB_HOST: postgres
      PECULIUM_DB_PORT: 5432
      PECULIUM_DB_NAME: peculium_test
      PECULIUM_DB_USER: peculium
      PECULIUM_DB_PASSWORD: peculium
      PECULIUM_DB_SSLMODE: disable
      PECULIUM_REDIS_ADDR: redis:6379
      PECULIUM_JWT_SECRET: test-secret
      PECULIUM_SERVER_PORT: 8080
      PECULIUM_LOG_LEVEL: debug
      PECULIUM_YAHOO_FINANCE_ENABLED: "false"
      PECULIUM_PYTHON_SERVICE_URL: "http://python-service:8000"
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    command: >
      sh -c "sleep 3 && /server migrate && /server"

  python-service:
    build:
      context: ./python-service
      dockerfile: Dockerfile
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata_test:
    name: peculium_pgdata_test
