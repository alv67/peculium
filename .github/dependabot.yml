version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      frontend:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /website
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      website:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /python-service
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      compose:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /backend
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      backend-image:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /frontend
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      frontend-image:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /python-service
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      python-image:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
