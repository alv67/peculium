version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      go-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      go-major:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: npm
    directory: /frontend
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      frontend-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      frontend-major:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: npm
    directory: /website
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      website-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      website-major:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: pip
    directory: /python-service
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      python-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      python-major:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      compose-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      compose-major:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: docker
    directory: /backend
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      backend-image-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      backend-image-major:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: docker
    directory: /frontend
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      frontend-image-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      frontend-image-major:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: docker
    directory: /python-service
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      python-image-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      python-image-major:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      actions-major:
        patterns: ["*"]
        update-types: ["major"]
