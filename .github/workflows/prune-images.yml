name: Prune images

# Retention policy for the images published by publish-images.yml. Container
# image storage is free for public packages, so this is housekeeping: the tag
# list stays short and the package pages stay readable.
#
# RULES (applied per image):
#   - versions carrying a release tag (`v*`), `latest` or `develop` are never
#     deleted: `exclude-tags` takes priority over every other rule;
#   - at most 10 of the remaining tagged versions (the `sha-*` / `rc-*` churn)
#     are kept, newest first;
#   - untagged leftovers are deleted;
#   - every rule only applies to versions older than 30 days, so a test build
#     dispatched recently is never touched, whatever its tag;
#   - a manual dispatch runs in `dry-run` by default (log only).
#
# CAUTION: this needs a GHCR-aware action. `actions/delete-package-versions` is
# not usable for these images: for container packages the version "name" is the
# digest, so `ignore-versions` cannot protect a release tag, and deleting the
# untagged versions removes the per-architecture child manifests, breaking the
# multi-arch images (`manifest unknown` on pull).
#
# The five packages must grant this repository the Admin role under
# Package Settings -> Manage Actions access. They are published by this repo,
# so the grant is normally already in place; a 403 in the log means it is not.

on:
  schedule:
    - cron: "23 4 * * 1" # weekly, Monday 04:23 UTC (off the top of the hour)
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Log the versions that would be deleted, delete nothing"
        type: boolean
        default: true

permissions:
  packages: write

concurrency:
  group: prune-images
  cancel-in-progress: false

jobs:
  prune:
    name: Prune old image versions
    runs-on: ubuntu-latest
    steps:
      # Pinned to an exact version rather than a moving major tag: this action
      # is handed `packages: write` and can delete every version, so updates
      # come through Dependabot PRs. See the CAUTION note above.
      - uses: dataaxiom/ghcr-cleanup-action@v1.2.2
        with:
          package: peculium-backend,peculium-worker,peculium-python-service,peculium-frontend,peculium-secrets-init
          exclude-tags: "v*,latest,develop"
          keep-n-tagged: 10
          delete-untagged: true
          older-than: 30 days
          validate: true
          # The schedule (no inputs) prunes for real; a manual dispatch
          # defaults to a dry run.
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run || 'false' }}
