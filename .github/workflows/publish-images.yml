name: Publish images

# Publishes the five Peculium images to GHCR as multi-arch
# (linux/amd64 + linux/arm64) manifests, and on v* tags also creates the
# GitHub Release from docs/RELEASE-NOTES.en.md.
#
# GHCR VISIBILITY GOTCHA: packages pushed with GITHUB_TOKEN default to
# PRIVATE even when the repository is public. After the FIRST successful
# publish of each image (peculium-backend, peculium-worker,
# peculium-python-service, peculium-frontend, peculium-secrets-init), an
# owner must flip each package to Public once via the package settings page
# (or `gh api` with a classic/PAT token) — GITHUB_TOKEN cannot change
# package visibility, so anonymous `podman/docker pull` fails until that is
# done.
#
# WEBSITE DEPLOY: the website workflow (issue #102) does not exist yet; it
# will trigger on the same `push: tags: v*` event, so no workflow_dispatch
# call is wired here. When #102 lands, tag pushes deploy the site alongside
# this workflow automatically.
#
# TRIGGERS: images are built on a `v*` tag (the release) and on manual
# dispatch (test/RC builds). Plain pushes/merges on `main` do NOT build:
# `latest` therefore always tracks the most recent release tag, never a
# branch head. `workflow_dispatch` is kept as the escape hatch to re-publish
# a failed release and to publish a test tag; pass `version` to name the test
# image (e.g. `rc-2026-10-03`). A named dispatch never moves `latest`.
#
# TAG CHANNELS:
#   :vX / :latest  -> the release (from a `v*` tag on main)
#   :develop       -> the latest build dispatched from the `develop` branch
#   :rc-<date>     -> a named test/RC build (workflow_dispatch `version` input)
#   :sha-<commit>  -> the exact commit of any build (always published)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Extra image tag for a test/RC build (e.g. rc-2026-10-03). Leave empty to publish only :sha-<commit>."
        required: false
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build & push (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
            dockerfile: backend/Dockerfile
          - name: worker
            context: backend
            dockerfile: backend/Dockerfile.worker
          - name: python-service
            context: python-service
            dockerfile: python-service/Dockerfile
          - name: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
          - name: secrets-init
            context: backend
            dockerfile: backend/Dockerfile.secrets
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/peculium-${{ matrix.name }}
          tags: |
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Per-image cache scope: the backend/ context is shared by three
          # Dockerfiles, so isolated scopes avoid cross-matrix cache churn.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          # Keep the manifest list clean for podman (no unknown attestation
          # entries in the GHCR UI / index).
          provenance: false

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Extract release notes for ${{ github.ref_name }}
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes_file="docs/RELEASE-NOTES.en.md"
          escaped_tag="${TAG//./\\.}"
          if ! grep -Eq "^## ${escaped_tag} " "$notes_file"; then
            echo "::error::No '## ${TAG}' section found in ${notes_file}. Add the release notes and re-tag."
            exit 1
          fi
          # From the tag's header line up to (not including) the next '^## ' header.
          # Literal prefix match via index() — no regex-escaping pitfalls.
          awk -v hdr="## ${TAG} " '
            !in_section && index($0, hdr) == 1 { in_section = 1; next }
            in_section && /^## / { exit }
            in_section { print }
          ' "$notes_file" > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::Section '## ${TAG}' in ${notes_file} is empty. Refusing to create a release without notes."
            exit 1
          fi
          echo "----- Release notes for ${TAG} -----"
          cat release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --title "Peculium $TAG" --notes-file release-notes.md
